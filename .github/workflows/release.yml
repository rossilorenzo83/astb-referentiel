name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed for softprops/action-gh-release to create the release

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -t tests -v

      - name: Build onedir bundle (folder format, fewer AV false positives)
        run: pyinstaller --onedir --windowed --noupx --name ASTB_Annuaire --version-file version_info.txt --collect-submodules src launcher.py

      - name: Verify onedir output
        shell: pwsh
        run: |
          Write-Host "=== dist tree after onedir build ==="
          Get-ChildItem dist -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path "dist\ASTB_Annuaire\ASTB_Annuaire.exe")) {
            throw "FATAL: onedir build did not produce dist\ASTB_Annuaire\ASTB_Annuaire.exe"
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $stagingDir = "release_assets"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          # Zip the onedir bundle (recommended)
          $zipPath = "$stagingDir\ASTB_Annuaire_$version.zip"
          Compress-Archive -Path "dist\ASTB_Annuaire\*" -DestinationPath $zipPath -Force

          # Verify the zip actually contains the exe
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $entries = @($zip.Entries | ForEach-Object { $_.FullName })
          $zip.Dispose()
          Write-Host "=== zip contents ==="
          $entries | ForEach-Object { Write-Host "  $_" }
          if (-not ($entries -contains "ASTB_Annuaire.exe")) {
            throw "FATAL: zip $zipPath does not contain ASTB_Annuaire.exe at root"
          }

          # SHA256 checksums for integrity verification
          $sumsPath = "$stagingDir\SHA256SUMS.txt"
          $files = @(Get-ChildItem $stagingDir -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" })
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          Set-Content -Path $sumsPath -Value $lines -Encoding ascii

          Write-Host "=== release_assets ==="
          Get-ChildItem $stagingDir | Format-Table -AutoSize

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/ASTB_Annuaire_${{ github.ref_name }}.zip
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## Installation

            1. Download `ASTB_Annuaire_${{ github.ref_name }}.zip`
            2. Extract the zip to a folder of your choice
            3. Run `ASTB_Annuaire.exe` from inside the extracted folder

            On first run, Windows SmartScreen may show "Windows protected your PC" - click **More info** then **Run anyway**. This is normal for unsigned executables.

            For convenience: right-click `ASTB_Annuaire.exe` after extracting and pin it to Start or create a desktop shortcut.

            ## Integrity verification

            Compare the SHA256 of the downloaded file against `SHA256SUMS.txt`:
            ```powershell
            Get-FileHash ASTB_Annuaire_${{ github.ref_name }}.zip -Algorithm SHA256
            ```
